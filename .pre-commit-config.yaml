# pre-commit install   (https://pre-commit.com)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: marineris-guard
        name: refuse runtime data, env files and assistant metadata
        entry: scripts/check-forbidden-files.sh
        language: script
        pass_filenames: true
